name: Import approved public feedback Ideas

on:
  push:
    branches:
      - main
    paths:
      - 'ideas/inbox/*.md'

permissions:
  contents: read
  discussions: write

concurrency:
  group: feedback-public-ideas-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved public idea files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish ideas to Discussions category Ideas
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/import_public_ideas.py
