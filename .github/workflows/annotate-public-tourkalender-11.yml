name: GGP Idea 11 - Bestehende Tourwertungen im Code verifiziert

# Einmalig und idempotent. Kein Build, keine geheimen Links, keine Produktumstellung.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/annotate-public-tourkalender-11.yml'

permissions:
  contents: read
  discussions: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm K8 source inventory, no duplicate features
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          if os.environ.get("GH_REPOSITORY") != "burnhardbot/feedback":
              raise RuntimeError("Wrong repository for public idea")
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/graphql"
          marker = "<!-- streamen-tourcalendar-idea11-codefirst-verified-20261111 -->"

          query = """
          query($cursor: String) {
            repository(owner: "burnhardbot", name: "feedback") {
              discussion(number: 11) {
                id number title closed url category { name }
                comments(first: 100, after: $cursor) {
                  nodes { body }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          """
          mutation = """
          mutation($id: ID!, $body: String!) {
            addDiscussionComment(input: { discussionId: $id, body: $body }) {
              comment { url }
            }
          }
          """
          def graphql(q, args):
              req = Request(api,
                 data=json.dumps({"query": q, "variables": args}).encode("utf-8"),
                 headers={
                   "Authorization": "Bearer " + token,
                   "Accept": "application/vnd.github+json",
                   "Content-Type": "application/json",
                   "User-Agent": "streamen-tourcalendar-idea11-decision"})
              with urlopen(req, timeout=30) as res:
                  answer = json.load(res)
              if answer.get("errors"):
                  raise RuntimeError("GraphQL rejected query: " + str(answer["errors"]))
              return answer["data"]

          cursor = None
          found = False
          row = None
          while True:
              response = graphql(query, {"cursor": cursor})["repository"]
              row = response["discussion"] if response else None
              if not row or row["number"] != 11:
                  raise RuntimeError("Expected public Discussion #11 missing")
              if row["closed"]:
                  raise RuntimeError("Public Discussion #11 is closed; no unsolicited reopen")
              if (row["category"]["name"] or "").casefold() != "ideas":
                  raise RuntimeError("Not an Ideas discussion")
              if "tour" not in row["title"].casefold():
                  raise RuntimeError("Discussion title does not match Tourkalender: " + row["title"])
              comments = row["comments"]
              found = found or any(marker in (c.get("body") or "") for c in comments["nodes"])
              page = comments["pageInfo"]
              if not page["hasNextPage"]:
                  break
              cursor = page["endCursor"]
              if not cursor:
                  raise RuntimeError("Pagination cursor missing")
          if found:
              print("Idea #11 already annotated; no duplicate")
          else:
              body = (
                "**CODE-FIRST-KLAERUNG (11.11.2026): Bestehende GGP-Funktionen erhalten.**\\n\\n"
                "Der original gepruefte aktuelle Streamen-Server enthaelt schon "
                "**gemeinsame GGP-Touren und eine gemeinsame Fahrer-Rangliste fuer alle "
                "Streamer**, parallele Touren, feste Kilometer-/Sprint-/Berg-/Etappensieg-"
                "Wertungsregeln und eine gesicherte historische Rueckrechnung beim "
                "Anlegen einer ganzen Tour. **Dazu braucht es keine neue Abstimmung oder "
                "zweite Ranking-Engine.**\\n\\n"
                "**Verbleibender geplanter Unterschied:** Einzelne Etappen gezielt zu "
                "ausgewaehlten Touren zuordnen statt automatisch zu allen zeitlich "
                "aktiven Touren; nach Etappenende Zuordnungen mit Aenderungsprotokoll "
                "korrigieren und die betroffenen gemeinsamen Tourwertungen neu berechnen. "
                "Die Entscheidungen B, C und gemeinsames Ranking A bleiben bestehen. "
                "Keine neuen tourindividuellen Gewichtungen erfinden.\\n\\n"
                "**Status: IN UMSETZUNG – PLANUNG AKTIV**, Bestandscode bestaetigt, "
                "Erweiterung/Win10-/OBS-/Liveabnahme noch offen; kein Server-Build.\\n\\n"
                + marker)

              result = graphql(mutation, {"id": row["id"], "body": body})
              comment = result["addDiscussionComment"]["comment"]
              if not comment or not comment.get("url"):
                  raise RuntimeError("No comment URL after mutation")
              print("Updated public Tourkalender Discussion: " + comment["url"])
          PY
