name: Publish prepared release notes and permanent test backlog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared manifest version, e.g. v1.3.1 (file must exist in main)"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: streamen-public-test-backlog
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'laberfeuer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate transform invariants
        run: python -m unittest discover -s tools/updates -p 'test_*.py' -v
      - name: Publish prepared changelog and append only new checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STREAMEN_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$STREAMEN_RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid version input' >&2
            exit 1
          fi
          python tools/updates/publish_github.py "docs/updates/manifests/${STREAMEN_RELEASE_VERSION}.json"
