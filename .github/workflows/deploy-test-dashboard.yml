name: Deploy Streamen Test Center to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/dashboard/**'
      - '.github/workflows/deploy-test-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: streamen-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'burnhardbot/feedback'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public dashboard logic
        run: node --test test_dashboard.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - id: deployment
        uses: actions/deploy-pages@v4
